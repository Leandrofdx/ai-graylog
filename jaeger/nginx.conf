server {
  listen 80;
  server_name _;

  # Jaeger 1.76 não expõe /api/metrics/services (cai no SPA HTML) e o Monitor trava.
  # O formato de /api/services é compatível com o que a UI espera.
  location = /api/metrics/services {
    proxy_pass http://jaeger:16686/api/services;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Accept application/json;
  }

  location / {
    proxy_pass http://jaeger:16686;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
  }
}
